name: Enterprise Playwright Automation CI/CD (Toolshop v5.0)

on:
  push:
    branches: [main, master, develop, enterprise_automation]
  pull_request:
    branches: [main, master, develop, enterprise_automation]
  schedule:
    # Nightly regression run at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Target Test Suite to Execute (all, catalog, pdp, rentals, auth, register, checkout, contact, account, navigation, security, a11y-network, api)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - catalog
          - pdp
          - rentals
          - auth
          - register
          - checkout
          - contact
          - account
          - navigation
          - security
          - a11y-network
          - api

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_URL: https://practicesoftwaretesting.com
  API_BASE_URL: https://api.practicesoftwaretesting.com
  CI: true

jobs:
  e2e-sharded-matrix:
    name: ⚡ Playwright Enterprise Suite (Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies (Fast Offline-First)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Strict TypeScript Typecheck (tsc --noEmit)
        if: matrix.shardIndex == 1
        run: npm run typecheck

      - name: Cache Playwright Headless Chromium Binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-shell-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium Headless Shell (Skip Slow apt-get)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --only-shell

      - name: Execute Playwright Enterprise Test Shard (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: |
          if [ "${{ github.event.inputs.test_suite }}" != "" ] && [ "${{ github.event.inputs.test_suite }}" != "all" ]; then
            npm run test:${{ github.event.inputs.test_suite }} -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          else
            npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          fi

      - name: Upload Playwright HTML Report & Executive Summary (Shard ${{ matrix.shardIndex }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            reports/
          retention-days: 7
